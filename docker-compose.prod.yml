# Production Compose for Digiverse Event Hosting
services:
  postgres:
    image: postgres:16-alpine
    container_name: digiverse-prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-digiverse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-digiverse_prod_password}
      POSTGRES_DB: ${POSTGRES_DB:-digiverse}
    volumes:
      - digiverse_prod_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-digiverse} -d ${POSTGRES_DB:-digiverse}']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - digiverse_net

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: digiverse-prod-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: '0.0.0.0'
      DATABASE_URL: postgres://${POSTGRES_USER:-digiverse}:${POSTGRES_PASSWORD:-digiverse_prod_password}@postgres:5432/${POSTGRES_DB:-digiverse}
      SESSION_SECRET: ${SESSION_SECRET:-change_me_to_a_minimum_32_char_secret_key_for_prod}
      ADMIN_BOOTSTRAP_USER_ID: ${ADMIN_BOOTSTRAP_USER_ID:-admin}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-AdminEvent2026!SecureKey}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:80,http://127.0.0.1}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    networks:
      - digiverse_net

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: digiverse-prod-web
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-80}:80'
    depends_on:
      - server
    networks:
      - digiverse_net

networks:
  digiverse_net:
    driver: bridge

volumes:
  digiverse_prod_pgdata:

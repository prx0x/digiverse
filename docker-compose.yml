# Local development database for Digiverse (Build Phase 2+)
services:
  postgres:
    image: postgres:16-alpine
    container_name: digiverse-pg
    environment:
      POSTGRES_USER: digiverse
      POSTGRES_PASSWORD: digiverse
      POSTGRES_DB: digiverse
    ports:
      - '5432:5432'
    volumes:
      - digiverse_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U digiverse -d digiverse']
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  digiverse_pg_data:
